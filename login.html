<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div></div>

    <header id="main-header" class="wave">
        <div id="bg"></div>


        <div id="logo-name">
            
            <div id="logos">
                <img src="stDemetriosLogo.png" alt="" id="sdz-logo"> 
                <img src="sno-logo.png" alt="" id="sno-logo">
            </div>
            
            
            <p id="title">SDZ Scout Tracker</p>
        </div>
        
        <div id="header-options">
            <div class="options">Church</div>
            <div class="options">Sections</div>
            <div class="options">Leaders</div>
            
        </div>

        

    </header>
<img class="sections-bg" src="Contour-Map.svg" alt="" aria-hidden="true">

        <div id="main" >     
             
                <div id="login-title">
                    <h1>Login</h1>
                    <p>Please Enter Your Credentials</p>
                </div> 
                
                <form action="" method="post">
                    <div class="credentials" id="username">
                        <label for="login-username">Username:</label>
                        <input type="text" id="login-username" name="login_username" placeholder="George Bou Faysal">
                    </div>
                    <div class="credentials" id="password">
                        <label for="login-pass">Password:</label>
                        <input type="password" id="login-pass" name="login_pass" placeholder="123456">
                    </div>
                    <div id="button-cont">
                        <button type="submit">Log in</button>
                    </div>
                    
                  
                    
                    
                </form>
            </div>
            
        </div>
   
</body>
</html>
